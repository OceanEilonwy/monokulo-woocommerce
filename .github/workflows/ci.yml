# Tests on every pull request and push to main. Each job runs the shop in
# Docker on the runner's own network (docker/compose.yaml), so it is Linux
# only.
#
# - test: WordPress 7.1.3 with WooCommerce 11.2.1 on PHP 8.1, 8.4 and 8.5:
#   the zip installed in the shop with WP-CLI, then the wordpress suite.
#   Webhooks are tested against Monokulo's published vectors (tests/vectors,
#   pinned in tests/vectors/PIN). 8.4 also reports coverage and runs
#   WordPress Coding Standards (scripts/test lint).
# - vectors: the vendored vectors are still the ones at the pinned commit.
# - smoke: against a real Monokulo built from the pinned commit (or a given
#   image), twice: at its host's root, and under a path behind a proxy with
#   an onion address (scripts/smoke). On main, nightly and by hand, not on
#   pull requests (building Monokulo takes a while).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      monokulo_image:
        description: Monokulo image for the smoke test (empty builds the commit in tests/vectors/PIN)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
          - php: '8.4'
            coverage: true
          - php: '8.5'
    env:
      PHP_VERSION: ${{ matrix.php }}
      COVERAGE: ${{ matrix.coverage && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Start WordPress
        run: scripts/test up
      - name: Run the tests
        run: scripts/test all
      - name: WordPress Coding Standards
        if: matrix.php == '8.4'
        run: scripts/test lint
      - name: Coverage summary
        if: matrix.coverage
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed -n '1,10p' coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.coverage
        with:
          name: coverage
          path: coverage/html
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: monokulo.zip
          path: |
            dist/monokulo.zip
            dist/monokulo.zip.sha256
      # Apache's error.log in the php image is a link to /dev/stderr: Apache's
      # log is the container's own output (docker compose logs). Every
      # command is bounded.
      - name: WordPress's and the plugin's logs
        if: failure()
        timeout-minutes: 3
        run: |
          timeout 60 docker compose -f docker/compose.yaml exec -T wordpress sh -c 'tail -n 100 /var/www/html/wp-content/debug.log /var/www/html/wp-content/uploads/wc-logs/*.log' || true
          timeout 60 docker compose -f docker/compose.yaml logs --no-color --tail 200 wordpress || true

  vectors:
    name: Webhook vectors match the pinned Monokulo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the pinned commit
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
        run: scripts/vectors check

  smoke:
    name: Smoke test against Monokulo
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build Monokulo at the pinned commit
        if: inputs.monokulo_image == ''
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
        run: |
          . tests/vectors/PIN
          auth=${MONOKULO_READ_TOKEN:+x-access-token:$MONOKULO_READ_TOKEN@}
          docker build -t monokulo:smoke "https://${auth}${repository#https://}.git#${commit}"
      # The OpenAPI document with Monokulo's recorded exchanges, which the
      # unit tests' fixtures are checked against (the served one has none).
      # rustup installs the toolchain the repository names.
      - name: Write Monokulo's OpenAPI document at the pinned commit
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
        run: |
          . tests/vectors/PIN
          auth=${MONOKULO_READ_TOKEN:+x-access-token:$MONOKULO_READ_TOKEN@}
          git init -q "$RUNNER_TEMP/monokulo"
          cd "$RUNNER_TEMP/monokulo"
          git fetch -q --depth 1 "https://${auth}${repository#https://}.git" "$commit"
          git checkout -q FETCH_HEAD
          cargo xtask api openapi --out "$GITHUB_WORKSPACE/dist/openapi.json"
      - name: Start WordPress and install the plugin
        run: |
          scripts/test up
          scripts/test install
      - name: Smoke test
        env:
          MONOKULO_IMAGE: ${{ inputs.monokulo_image || 'monokulo:smoke' }}
        run: scripts/smoke
      - name: WordPress's and the plugin's logs
        if: failure()
        timeout-minutes: 3
        run: |
          timeout 60 docker compose -f docker/compose.yaml exec -T wordpress sh -c 'tail -n 100 /var/www/html/wp-content/debug.log /var/www/html/wp-content/uploads/wc-logs/*.log' || true
          timeout 60 docker compose -f docker/compose.yaml logs --no-color --tail 200 wordpress || true
