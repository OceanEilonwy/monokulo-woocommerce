# Monokulo for the smoke test (scripts/smoke): a fresh instance on this
# machine's network, where the shop is http://localhost:8092/.
#
# - public_uri: Monokulo's own address, where the connect flow's pages and
#   the API are. Without it Monokulo can't connect plugins. Port 18092,
#   beside the shop's 8092, so other shops' smoke tests on this machine
#   don't collide with it.
# - webhooks.allow_private_urls: the shop's webhook address is on this
#   machine; Monokulo refuses private addresses unless told otherwise.
# - signup: anyone can make an account (the test signs up a merchant).
# - exchange_rate: prices from a stand-in for CoinGecko on this machine
#   (tests/Smoke/fake-rates.php, started by scripts/smoke on 18095): USD
#   priced, EUR rate limited, so orders don't depend on the real one and
#   a real rates-unavailable can be met.
# - engine.monero_node: a wallet can only be added on a network with a node.
#   Nothing is paid in the smoke test, so the node needn't answer.
public_uri = "http://localhost:18092"

[server]
bind = "127.0.0.1:18092"

[signup]
mode = "public"

[webhooks]
allow_private_urls = true

[exchange_rate]
coingecko_base_url = "http://localhost:18095"
coinmarketcap_enabled = false

[engine.monero_node]
mainnet = { host = "127.0.0.1", port = 18089, ssl = false }

[engine.proof_of_work]
mainnet = false
