# The smoke test's Monokulo under a path (scripts/smoke, onion): the proxy
# passes http://localhost:18092/monokulo/… on to the Monokulo on 18093 as
# /…, as a reverse proxy in front of a Monokulo served under a path does.
# Monokulo's public_uri carries the path, so its links, forms, redirects
# and cookies do too.
server {
    listen 127.0.0.1:18092;
    location /monokulo/ {
        proxy_pass http://127.0.0.1:18093/;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
