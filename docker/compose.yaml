# WordPress 7.1.3 with WooCommerce 11.2.1 and this plugin's repository
# mounted at /repo, on the host's network: the shop is http://localhost:8092/
# from the browser, from a Monokulo on this machine and from the tests alike.
# Monokulo only sends its connect flow back to an https address or to
# localhost, and the shop's webhook address is built from the same host, so
# one address for everyone is what makes the smoke test work. (Linux only:
# Docker Desktop's host networking differs.)
#
# The shop's database is `wordpress`; the PHPUnit suite installs its own
# tables in `wordpress_tests` (made by wp-setup), so a test run leaves the
# shop alone.
name: monokulo-woocommerce

services:
  db:
    image: mariadb:11.4
    network_mode: host
    command: ["--port=${DB_PORT:-33062}", "--bind-address=127.0.0.1"]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  wordpress:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    image: monokulo-woocommerce:php${PHP_VERSION:-8.4}
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PORT: ${DB_PORT:-33062}
      WP_URL: http://localhost:8092
    volumes:
      - ..:/repo
