# Monokulo for the smoke test's second run (scripts/smoke, onion): as
# docker/monokulo-smoke.toml, but served under a path behind a proxy
# (docker/smoke-proxy.conf), and with an onion address.
#
# - public_uri: the address with its path, through the proxy on 18092.
#   Monokulo itself listens on 18093.
# - tor: an external tor would serve onion_uri and pass its visitors to
#   onion_listener. None runs here: Monokulo only needs the address to
#   link to it (mk:onion-checkout, onion_api).
public_uri = "http://localhost:18092/monokulo"
onion_uri = "http://2gzyxa5ihm7nsggfxnu52rck2vv4rvmdlkiu3zzui5du4xyclen53wid.onion"

[server]
bind = "127.0.0.1:18093"

[tor]
mode = "external"

[abuse]
onion_listener = "127.0.0.1:18094"

[signup]
mode = "public"

[webhooks]
allow_private_urls = true

[engine.monero_node]
mainnet = { host = "127.0.0.1", port = 18089, ssl = false }

[engine.proof_of_work]
mainnet = false
